; H@N-CYD-GBC - Game Boy / Game Boy Color emulator for the ESP32-2432S024C
;
; The released .bin files were built with arduino-cli (see README):
;   BT build:         Bluepad32 board package 4.1.0 (Arduino-ESP32 2.0.x + Bluepad32)
;   touch-only build: Arduino-ESP32 2.0.17
; The env below builds the touch-only version. The Bluepad32 env is untested
; with PlatformIO; the Arduino IDE / arduino-cli route is the verified one.

[env]
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps = lovyan03/LovyanGFX@1.1.16

[env:cyd2432s024c]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17, no Bluetooth
board_build.partitions = partitions_touch.csv   ; smaller app, more room for ROMs

[env:cyd2432s024c_bt]
platform = espressif32@6.9.0
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
